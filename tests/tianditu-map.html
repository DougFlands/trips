<!doctype html>
<html lang="zh-CN">
  <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>天地图组件回归检查</title></head>
  <body>
    <style>#root > div { min-height: 680px; } #root [aria-label] { height: 680px; width: 100%; }</style>
    <pre id="result">运行中…</pre><div id="root"></div>
    <script type="module">
      import { createElement } from 'react';
      import { createRoot } from 'react-dom/client';
      import { TiandituMap } from '/src/TiandituMap.tsx';

      const root = createRoot(document.getElementById('root'));
      root.render(createElement(TiandituMap, {
        places: [{ id: 'demo', name: '测试点', coord: [113, 23], note: '天地图组件测试' }],
        label: '天地图回归地图',
      }));
      setTimeout(() => {
        const status = document.querySelector('[role="status"]');
        document.getElementById('result').textContent = status?.textContent?.includes('加载失败')
          ? `FAIL ${status.textContent}`
          : status?.textContent?.includes('未配置')
            ? '未执行：请在 .env.local 配置 VITE_TIANDITU_KEY 后重启 Vite'
            : 'PASS 天地图真实 SDK 已初始化，请检查底图与单点标记';
      }, 2500);
    </script>
  </body>
</html>
